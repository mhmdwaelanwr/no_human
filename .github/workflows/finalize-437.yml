name: Finalize issue 437

on:
  push:
    branches:
      - fix/review-diff-coverage-437
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-repin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/review-diff-coverage-437
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run focused review tests
        run: uv run pytest tests/test_diff_coverage.py tests/test_reviewer.py -q

      - name: Run adjacent git-diff security regression
        run: uv run pytest tests/test_git_config_exec.py -q

      - name: Remove temporary workflow and re-pin manifest
        shell: bash
        run: |
          git rm .github/workflows/finalize-437.yml
          python scripts/check_release_manifest.py --write
          git add RELEASE_MANIFEST.txt
          python scripts/check_release_manifest.py --strict
          git diff --check

      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "Mohamed Anwar"
          git config user.email "mhmdwaelanwr@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: re-pin release manifest"
          git push origin HEAD:fix/review-diff-coverage-437
