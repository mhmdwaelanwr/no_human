from __future__ import annotations

import ast
import re
import shlex


_COVERAGE_NOTE = (
    "\nDIFF COVERAGE — the following changed-file patches were cut by the "
    "per-file budget. Before PASS, inspect every path below with read/search "
    "tools so the omitted patch content is covered:\n"
)
_MIN_HEADER_BUDGET = 1
_MAX_STAT_CHARS = 2_000


class DiffCoverageError(RuntimeError):
    """The bounded representation cannot honestly show every changed file."""


def _unquote_path(token: str) -> str:
    token = token.strip()
    if token.startswith('"'):
        try:
            token = ast.literal_eval(token)
        except (SyntaxError, ValueError):
            token = token.strip('"')
    if token.startswith(("a/", "b/")):
        token = token[2:]
    return token


def _patch_path(chunk: str) -> str:
    for line in chunk.splitlines():
        if line.startswith("rename to "):
            return _unquote_path(line[len("rename to "):])
        if line.startswith("+++ "):
            candidate = line[4:].strip()
            if candidate != "/dev/null":
                return _unquote_path(candidate)
    for line in chunk.splitlines():
        if line.startswith("--- "):
            candidate = line[4:].strip()
            if candidate != "/dev/null":
                return _unquote_path(candidate)
    first = chunk.splitlines()[0] if chunk else ""
    try:
        parts = shlex.split(first)
    except ValueError:
        parts = []
    if len(parts) >= 4 and parts[:2] == ["diff", "--git"]:
        return _unquote_path(parts[3])
    raise DiffCoverageError("could not identify a changed path from a patch header")


def _split(raw: str) -> tuple[str, list[str]]:
    starts = [m.start() for m in re.finditer(r"(?m)^diff --git ", raw)]
    if not starts:
        raise DiffCoverageError("large diff has no per-file patch boundaries")
    prefix = raw[:starts[0]]
    chunks = [
        raw[start:(starts[i + 1] if i + 1 < len(starts) else len(raw))]
        for i, start in enumerate(starts)
    ]
    return prefix, chunks


def _allocate(chunks: list[str], budget: int) -> list[int]:
    headers = []
    for chunk in chunks:
        newline = chunk.find("\n")
        headers.append(len(chunk) if newline < 0 else newline + 1)
    minimum = sum(max(_MIN_HEADER_BUDGET, n) for n in headers)
    if minimum > budget:
        raise DiffCoverageError(
            f"{len(chunks)} changed files need {minimum:,} chars just for patch headers, "
            f"but only {budget:,} are available"
        )
    alloc = [min(len(chunk), max(_MIN_HEADER_BUDGET, head)) for chunk, head in zip(chunks, headers)]
    remaining = budget - sum(alloc)
    active = {i for i, chunk in enumerate(chunks) if alloc[i] < len(chunk)}
    while active and remaining:
        share = max(1, remaining // len(active))
        progressed = False
        for i in list(active):
            need = len(chunks[i]) - alloc[i]
            grant = min(need, share, remaining)
            if grant:
                alloc[i] += grant
                remaining -= grant
                progressed = True
            if alloc[i] == len(chunks[i]):
                active.remove(i)
            if not remaining:
                break
        if not progressed:
            break
    return alloc


def budget_diff(raw: str, cap: int) -> tuple[str, list[str]]:
    """Return ``raw`` unchanged when it fits, else fairly budget every patch.

    The exclusion set is intentionally empty and code-owned: target repositories
    cannot configure paths out of coverage. If the cap cannot hold at least each
    patch header plus the explicit cut-path ledger, fail instead of silently
    hiding a file.
    """
    if len(raw) <= cap:
        return raw, []

    prefix, chunks = _split(raw)
    paths = [_patch_path(chunk) for chunk in chunks]
    # Reserve the worst-case ledger (all paths cut) before assigning patch text.
    worst_note = _COVERAGE_NOTE + "".join(f"- {path}\n" for path in paths)
    separators = max(0, len(chunks) - 1)
    available = cap - len(worst_note) - separators
    if available <= 0:
        raise DiffCoverageError("cut-path ledger alone exceeds the diff cap")

    first_lines = [chunk.find("\n") + 1 if "\n" in chunk else len(chunk) for chunk in chunks]
    required = sum(first_lines)
    if required > available:
        raise DiffCoverageError(
            f"{len(chunks)} changed files cannot all expose their patch headers within {cap:,} chars"
        )

    prefix_budget = min(len(prefix), _MAX_STAT_CHARS, available - required)
    patch_budget = available - prefix_budget
    allocation = _allocate(chunks, patch_budget)
    cut_paths = [path for path, chunk, take in zip(paths, chunks, allocation) if take < len(chunk)]
    note = _COVERAGE_NOTE + "".join(f"- {path}\n" for path in cut_paths)
    rendered = prefix[:prefix_budget] + "\n".join(
        chunk[:take] for chunk, take in zip(chunks, allocation)
    ) + note
    if len(rendered) > cap:
        raise DiffCoverageError("bounded diff exceeded its cap after rendering")
    return rendered, cut_paths
''')

          Path('tests/test_diff_coverage.py').write_text(r'''from __future__ import annotations

import json
import subprocess
from pathlib import Path

import pytest

from no_human.agent.claude_backend import AgentEvent, AgentResult
from no_human.core.task import Task
from no_human.review.reviewer import (
    AdversarialReviewer,
    ReviewerUnavailable,
    _DIFF_CAP,
    _git_diff,
)


def _git(repo: Path, *args: str) -> str:
    return subprocess.run(
        ["git", *args], cwd=repo, check=True, capture_output=True, text=True,
    ).stdout


def _repo(tmp_path: Path) -> Path:
    repo = tmp_path / "repo"
    repo.mkdir()
    _git(repo, "init")
    _git(repo, "config", "user.email", "test@example.com")
    _git(repo, "config", "user.name", "Test")
    (repo / "seed.txt").write_text("seed\n")
    _git(repo, "add", ".")
    _git(repo, "commit", "-m", "seed")
    return repo


def _passing_verdict() -> str:
    data = {
        "passed": True,
        "stages": {
            "spec_compliance": {"passed": True},
            "code_quality": {"passed": True},
        },
        "suggested_next": None,
        "goal": {"reachable": True, "entry_point": "x.py:1", "evidence": "ok"},
        "items": [{"label": "ok", "passed": True, "severity": "low", "evidence": "ok"}],
    }
    return "REVIEW_JSON_START\n" + json.dumps(data) + "\nREVIEW_JSON_END\n"


def test_small_diff_is_byte_identical(tmp_path: Path):
    repo = _repo(tmp_path)
    (repo / "a.txt").write_text("changed\n")
    _git(repo, "add", ".")
    _git(repo, "commit", "-m", "change")
    expected = subprocess.run(
        ["git", "-c", "core.fsmonitor=false", "diff", "HEAD~1..HEAD", "--stat", "--patch",
         "--no-color", "--no-ext-diff", "--no-textconv"],
        cwd=repo, check=True, capture_output=True, text=True,
    ).stdout
    rendered, total, cuts = _git_diff(repo)
    assert rendered == expected
    assert total == len(expected)
    assert cuts == []


def test_large_diff_budgets_every_file_and_names_cut_paths(tmp_path: Path):
    repo = _repo(tmp_path)
    for name, char in (("a.txt", "a"), ("b.txt", "b"), ("tests.txt", "t")):
        (repo / name).write_text("\n".join(f"{char}{i:05d}" for i in range(9000)) + "\n")
    _git(repo, "add", ".")
    _git(repo, "commit", "-m", "large")
    rendered, total, cuts = _git_diff(repo)
    assert total > _DIFF_CAP
    assert len(rendered) <= _DIFF_CAP
    assert set(cuts) == {"a.txt", "b.txt", "tests.txt"}
    for path in ("a.txt", "b.txt", "tests.txt"):
        assert f"diff --git a/{path} b/{path}" in rendered
        assert f"- {path}\n" in rendered


class _Backend:
    model = "test"

    def __init__(self, inspect: str | None = None):
        self.inspect = inspect
        self.calls = 0

    async def run(self, prompt, *, cwd, max_turns, effort, on_event):
        self.calls += 1
        if self.inspect:
            on_event(AgentEvent("tool_use", tool_name="Read", tool_input={"file_path": self.inspect}))
        return AgentResult(
            final_text=_passing_verdict(), num_turns=1, is_error=False,
            tokens_used=1, session_id="s", stop_reason="end_turn",
        )


@pytest.mark.asyncio
async def test_pass_without_inspecting_a_cut_file_is_not_a_verdict(tmp_path: Path):
    backend = _Backend()
    reviewer = AdversarialReviewer(backend=backend)
    decision, reason, result = await reviewer._review_once(
        "prompt", tmp_path, max_turns=1, timeout=5,
        required_inspections=["tests/test_hidden.py"],
    )
    assert decision is None
    assert result is not None
    assert "tests/test_hidden.py" in reason


@pytest.mark.asyncio
async def test_pass_after_tool_call_names_the_cut_file_is_allowed(tmp_path: Path):
    backend = _Backend("tests/test_hidden.py")
    reviewer = AdversarialReviewer(backend=backend)
    decision, reason, result = await reviewer._review_once(
        "prompt", tmp_path, max_turns=1, timeout=5,
        required_inspections=["tests/test_hidden.py"],
    )
    assert decision is not None and decision.passed
    assert reason == ""
    assert result is not None


@pytest.mark.asyncio
async def test_repeated_uninspected_pass_escalates_as_reviewer_unavailable(tmp_path: Path):
    backend = _Backend()
    reviewer = AdversarialReviewer(backend=backend)
    with pytest.raises(ReviewerUnavailable, match="without inspecting truncated changed file"):
        await reviewer._agent_review(
            "prompt", tmp_path, max_turns=1, timeout=5,
            required_inspections=["tests/test_hidden.py"],
        )
    assert backend.calls == 2
''')

