name: Patch issue 437

on:
  push:
    branches:
      - fix/review-diff-coverage-437
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/review-diff-coverage-437
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Apply patch
        run: python .github/scripts/patch_437.py

      - name: Install project dependencies
        run: uv sync --group dev

      - name: Run issue 437 regression tests
        run: uv run pytest tests/test_diff_coverage.py -q

      - name: Run adjacent git-diff security regression
        run: uv run pytest tests/test_git_config_exec.py -q

      - name: Compile review package
        run: python -m compileall -q src/no_human/review

      - name: Check whitespace
        run: git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          rm -f .github/scripts/patch_437.py .github/workflows/patch-437.yml
          git config user.name "Mohamed Anwar"
          git config user.email "mhmdwaelanwr@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(review): preserve coverage for capped diffs"
          git push origin HEAD:fix/review-diff-coverage-437
